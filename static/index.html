<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platform Ops Dashboard</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans p-10">

    <div class="max-w-3xl mx-auto">
        <h1 class="text-3xl font-bold mb-8 text-blue-400">🚀 CI/CD Platform Dashboard</h1>
        
        <!-- Dashboard Card -->
        <div class="bg-gray-800 rounded-lg shadow-lg p-6 border border-gray-700">
            <h2 class="text-xl font-semibold mb-4 border-b border-gray-600 pb-2">Latest Pipeline Run</h2>
            
            <div id="loading" class="text-gray-400 animate-pulse">Fetching live data from GitHub Actions...</div>
            
            <div id="dashboard-content" class="hidden space-y-4">
                <div class="flex justify-between items-center">
                    <span class="text-gray-400">Workflow:</span>
                    <span id="workflow-name" class="font-mono bg-gray-700 px-2 py-1 rounded text-sm"></span>
                </div>
                
                <div class="flex justify-between items-center">
                    <span class="text-gray-400">Branch:</span>
                    <span id="branch" class="font-mono bg-blue-900 text-blue-300 px-2 py-1 rounded text-sm"></span>
                </div>

                <div class="flex justify-between items-center">
                    <span class="text-gray-400">Commit:</span>
                    <span id="commit" class="italic text-gray-300"></span>
                </div>

                <div class="flex justify-between items-center mt-4 pt-4 border-t border-gray-700">
                    <span class="text-lg font-bold">Status:</span>
                    <!-- Status Badge -->
                    <span id="status-badge" class="px-4 py-2 rounded-full font-bold text-sm tracking-wide">
                        UNKNOWN
                    </span>
                </div>

                <div class="mt-6 text-center">
                    <a id="github-link" href="#" target="_blank" class="text-blue-400 hover:text-blue-300 underline text-sm">
                        View Full Logs on GitHub &rarr;
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript to fetch data from your FastAPI backend -->
    <script>
        async function fetchStatus() {
            try {
                const response = await fetch('/api/cicd-status');
                const data = await response.json();
                
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('dashboard-content').classList.remove('hidden');
                
                document.getElementById('workflow-name').textContent = data.pipeline_name;
                document.getElementById('branch').textContent = data.branch;
                document.getElementById('commit').textContent = data.commit_message;
                document.getElementById('github-link').href = data.url;

                const badge = document.getElementById('status-badge');
                
                // Styling based on CI/CD success or failure
                if (data.conclusion === 'success') {
                    badge.textContent = '✅ PASSING';
                    badge.className = 'px-4 py-2 rounded-full font-bold text-sm tracking-wide bg-green-900 text-green-300 border border-green-700';
                } else if (data.conclusion === 'failure') {
                    badge.textContent = '❌ FAILED';
                    badge.className = 'px-4 py-2 rounded-full font-bold text-sm tracking-wide bg-red-900 text-red-300 border border-red-700';
                } else {
                    badge.textContent = '🔄 IN PROGRESS';
                    badge.className = 'px-4 py-2 rounded-full font-bold text-sm tracking-wide bg-yellow-900 text-yellow-300 border border-yellow-700 animate-pulse';
                }

            } catch (error) {
                document.getElementById('loading').textContent = "Error loading data.";
            }
        }

        // Fetch immediately, then refresh every 10 seconds
        fetchStatus();
        setInterval(fetchStatus, 10000);
    </script>
</body>
</html>
