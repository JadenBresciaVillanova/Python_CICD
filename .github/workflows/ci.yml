name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 1. STYLE & COMPLEXITY (Ruff)
    - name: Lint and check complexity with Ruff
      run: |
        ruff check .
        # C901 tells Ruff to fail if any function has a Cyclomatic Complexity > 10
        ruff check --select C901 . 

    # 2. TYPE CHECKING (Mypy)
    - name: Static Type Checking with Mypy
      run: |
        mypy src/

    # 3. SECURITY SCANNING (Bandit)
    - name: Security scan with Bandit
      run: |
        bandit -r src/

    # 4. TESTING & COVERAGE (Pytest)
    - name: Test with pytest
      run: |
        pytest --cov=src --cov-fail-under=80 tests/
        # --cov-fail-under=80 forces the pipeline to fail if coverage drops below 80%